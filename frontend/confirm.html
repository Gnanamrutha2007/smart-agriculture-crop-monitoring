<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email - Smart Agriculture</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🌱 Smart Agriculture
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Verify Your Email</h1>

            <p class="auth-description">
                We sent a verification code to your email address.
                Enter the code below to activate your farmer account.
            </p>


            <form id="confirmationForm">

                <div class="form-group">

                    <label for="verificationCode">
                        Verification Code
                    </label>

                    <input
                        type="text"
                        id="verificationCode"
                        name="verificationCode"
                        placeholder="Enter verification code"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="confirmButton"
                >
                    Verify Email
                </button>


                <p id="confirmationMessage"></p>

            </form>


            <p class="login-link">

                Already verified?

                <a href="login.html">
                    Go to Login
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Smart Agriculture Crop Monitoring System
        </p>

    </footer>


    <!-- AWS Cognito JavaScript SDK -->

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>


    <script>

        // ==========================================
        // COGNITO CONFIGURATION
        // ==========================================

        const poolData = {

            UserPoolId:
                "ap-south-1_QZT7vDGVW",

            ClientId:
                "470o9e2j7gd3888smk5cqqba9i"

        };


        const userPool =
            new AmazonCognitoIdentity.CognitoUserPool(
                poolData
            );


        // ==========================================
        // GET EMAIL USED DURING REGISTRATION
        // ==========================================

        const email =
            sessionStorage.getItem(
                "registrationEmail"
            );


        const form =
            document.getElementById(
                "confirmationForm"
            );


        const message =
            document.getElementById(
                "confirmationMessage"
            );


        const confirmButton =
            document.getElementById(
                "confirmButton"
            );


        // ==========================================
        // CHECK EMAIL
        // ==========================================

        if (!email) {

            message.textContent =
                "Registration email was not found. Please register again.";

            message.className =
                "error-message";

            confirmButton.disabled = true;

        }


        // ==========================================
        // CONFIRM EMAIL
        // ==========================================

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const code =
                    document
                        .getElementById(
                            "verificationCode"
                        )
                        .value
                        .trim();


                if (!code) {

                    message.textContent =
                        "Please enter the verification code.";

                    message.className =
                        "error-message";

                    return;

                }


                confirmButton.disabled = true;

                confirmButton.textContent =
                    "Verifying...";

                message.textContent =
                    "Verifying your email...";

                message.className = "";


                // ----------------------------------
                // Create Cognito user object
                // ----------------------------------

                const cognitoUser =
                    new AmazonCognitoIdentity.CognitoUser({

                        Username: email,

                        Pool: userPool

                    });


                // ----------------------------------
                // Confirm registration
                // ----------------------------------

                cognitoUser.confirmRegistration(

                    code,

                    true,

                    function(error, result) {

                        confirmButton.disabled =
                            false;

                        confirmButton.textContent =
                            "Verify Email";


                        if (error) {

                            console.error(
                                "Confirmation error:",
                                error
                            );


                            message.textContent =
                                error.message ||
                                "Verification failed. Please check the code.";

                            message.className =
                                "error-message";

                            return;

                        }


                        console.log(
                            "Email verification successful:",
                            result
                        );


                        message.textContent =
                            "Email verified successfully! You can now login.";

                        message.className =
                            "success-message";


                        // Remove temporary registration data

                        sessionStorage.removeItem(
                            "registrationEmail"
                        );

                        sessionStorage.removeItem(
                            "registrationPhone"
                        );

                        sessionStorage.removeItem(
                            "registrationAddress"
                        );


                        // Redirect to login

                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );

                    }

                );

            }
        );

    </script>

</body>
</html>
