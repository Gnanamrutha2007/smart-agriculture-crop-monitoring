<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirm Account - Smart Agriculture</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <header class="navbar">

        <div class="logo">
            🌱 Smart Agriculture
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <main class="auth-container">

        <div class="auth-card">

            <h1>
                Confirm Your Account
            </h1>


            <p class="auth-description">

                We sent a verification code to your
                email address.

            </p>


            <form id="confirmationForm">


                <div class="form-group">

                    <label for="confirmationCode">

                        Verification Code

                    </label>


                    <input
                        type="text"
                        id="confirmationCode"
                        placeholder="Enter verification code"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="auth-button"
                >

                    Confirm Account

                </button>


                <p id="confirmationMessage"></p>


            </form>


            <p class="login-link">

                Already confirmed?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>



    <footer>

        <p>
            © 2026 Smart Agriculture Crop Monitoring System
        </p>

    </footer>



    <script src="js/amazon-cognito-identity.min.js"></script>

    <script src="cognito.js"></script>


    <script>

        const form =
            document.getElementById(
                "confirmationForm"
            );


        const message =
            document.getElementById(
                "confirmationMessage"
            );


        const email =
            sessionStorage.getItem(
                "confirmationEmail"
            );


        if (!email) {

            message.textContent =
                "Registration email not found. Please register again.";

            message.className =
                "error-message";

        }


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const code =
                    document.getElementById(
                        "confirmationCode"
                    ).value.trim();


                if (!email) {

                    return;

                }


                const userData = {

                    Username: email,

                    Pool: userPool

                };


                const cognitoUser =
                    new AmazonCognitoIdentity.CognitoUser(
                        userData
                    );


                cognitoUser.confirmRegistration(
                    code,
                    true,
                    function(error, result) {

                        if (error) {

                            console.error(error);


                            message.textContent =
                                error.message ||
                                "Confirmation failed.";

                            message.className =
                                "error-message";

                            return;

                        }


                        console.log(
                            "Confirmation result:",
                            result
                        );


                        message.textContent =
                            "Account confirmed successfully! Redirecting to login...";

                        message.className =
                            "success-message";


                        sessionStorage.removeItem(
                            "confirmationEmail"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
