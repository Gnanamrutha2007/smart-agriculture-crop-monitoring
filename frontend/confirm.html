<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirm Account - Smart Agriculture</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">
            🌱 Smart Agriculture
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Confirm Your Account</h1>

            <p class="auth-description">
                Enter the verification code sent to your email address.
            </p>


            <form id="confirmationForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmationCode">
                        Verification Code
                    </label>

                    <input
                        type="text"
                        id="confirmationCode"
                        placeholder="Enter verification code"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="confirmButton"
                >
                    Confirm Account
                </button>


                <button
                    type="button"
                    class="auth-button"
                    id="resendButton"
                    style="margin-top: 10px;"
                >
                    Resend Verification Code
                </button>


                <p id="confirmationMessage"></p>

            </form>


            <p class="login-link">

                Already confirmed?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Smart Agriculture Crop Monitoring System
        </p>

    </footer>


    <!-- Amazon Cognito JavaScript Library -->

    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>


    <script>

        // ================================
        // AMAZON COGNITO CONFIGURATION
        // ================================

        const poolData = {

            UserPoolId: "ap-south-1_QZT7vDGVW",

            ClientId: "470o9e2j7gd3888smk5cqqba9i"

        };


        const userPool =
            new AmazonCognitoIdentity.CognitoUserPool(
                poolData
            );


        // ================================
        // GET HTML ELEMENTS
        // ================================

        const form =
            document.getElementById(
                "confirmationForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const codeInput =
            document.getElementById(
                "confirmationCode"
            );


        const message =
            document.getElementById(
                "confirmationMessage"
            );


        const resendButton =
            document.getElementById(
                "resendButton"
            );


        const confirmButton =
            document.getElementById(
                "confirmButton"
            );


        // ================================
        // GET SAVED EMAIL
        // ================================

        const savedEmail =
            sessionStorage.getItem(
                "registrationEmail"
            );


        if (savedEmail) {

            emailInput.value = savedEmail;

        }


        // ================================
        // CONFIRM ACCOUNT
        // ================================

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                const code =
                    codeInput.value.trim();


                if (!email) {

                    message.textContent =
                        "Please enter your registered email.";

                    message.className =
                        "error-message";

                    return;

                }


                if (!code) {

                    message.textContent =
                        "Please enter the verification code.";

                    message.className =
                        "error-message";

                    return;

                }


                confirmButton.disabled = true;

                confirmButton.textContent =
                    "Confirming...";


                const userData = {

                    Username: email,

                    Pool: userPool

                };


                const cognitoUser =
                    new AmazonCognitoIdentity.CognitoUser(
                        userData
                    );


                cognitoUser.confirmRegistration(

                    code,

                    true,

                    function(error, result) {


                        if (error) {

                            console.error(
                                "Confirmation error:",
                                error
                            );


                            message.textContent =
                                error.message ||
                                "Confirmation failed.";

                            message.className =
                                "error-message";


                            confirmButton.disabled =
                                false;

                            confirmButton.textContent =
                                "Confirm Account";


                            return;

                        }


                        console.log(
                            "Confirmation successful:",
                            result
                        );


                        message.textContent =
                            "Account confirmed successfully! Redirecting to login...";

                        message.className =
                            "success-message";


                        sessionStorage.removeItem(
                            "registrationEmail"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );

                    }

                );

            }
        );


        // ================================
        // RESEND VERIFICATION CODE
        // ================================

        resendButton.addEventListener(
            "click",
            function() {

                const email =
                    emailInput.value.trim();


                if (!email) {

                    message.textContent =
                        "Please enter your registered email first.";

                    message.className =
                        "error-message";

                    return;

                }


                resendButton.disabled = true;

                resendButton.textContent =
                    "Sending...";


                const userData = {

                    Username: email,

                    Pool: userPool

                };


                const cognitoUser =
                    new AmazonCognitoIdentity.CognitoUser(
                        userData
                    );


                cognitoUser.resendConfirmationCode(

                    function(error, result) {


                        if (error) {

                            console.error(
                                "Resend error:",
                                error
                            );


                            message.textContent =
                                error.message ||
                                "Could not resend verification code.";

                            message.className =
                                "error-message";


                            resendButton.disabled =
                                false;

                            resendButton.textContent =
                                "Resend Verification Code";


                            return;

                        }


                        console.log(
                            "Verification code resent:",
                            result
                        );


                        message.textContent =
                            "A new verification code has been sent to your email.";

                        message.className =
                            "success-message";


                        resendButton.disabled =
                            false;

                        resendButton.textContent =
                            "Resend Verification Code";

                    }

                );

            }
        );

    </script>

</body>

</html>
