<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration - Smart Agriculture</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🌱 Smart Agriculture
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Farmer Registration</h1>

            <p class="auth-description">
                Create your farmer account to manage your farms,
                fields and crops.
            </p>


            <form id="registrationForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Farmer Account
                </button>


                <p id="registrationMessage"></p>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Smart Agriculture Crop Monitoring System
        </p>

    </footer>


    <script>

        const form =
            document.getElementById("registrationForm");

        const message =
            document.getElementById("registrationMessage");


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.className = "error-message";

                return;

            }


            message.textContent =
                "Registration form submitted successfully. AWS Cognito will be connected in the next stage.";

            message.className = "success-message";

        });

    </script>

</body>
</html>
