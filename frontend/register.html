<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration - Smart Agriculture</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🌱 Smart Agriculture
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Farmer Registration</h1>

            <p class="auth-description">
                Create your farmer account to manage your farms,
                fields and crops.
            </p>


            <form id="registrationForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    Create Farmer Account
                </button>


                <p id="registrationMessage"></p>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Smart Agriculture Crop Monitoring System
        </p>

    </footer>


    <!-- AWS SDK for Cognito -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>


    <script>

        // ==========================================
        // AMAZON COGNITO CONFIGURATION
        // ==========================================

        const poolData = {
            UserPoolId: "ap-south-1_QZT7vDGVW",
            ClientId: "470o9e2j7gd3888smk5cqqba9i"
        };

        const userPool =
            new AmazonCognitoIdentity.CognitoUserPool(poolData);


        // ==========================================
        // FORM ELEMENTS
        // ==========================================

        const form =
            document.getElementById("registrationForm");

        const message =
            document.getElementById("registrationMessage");

        const registerButton =
            document.getElementById("registerButton");


        // ==========================================
        // REGISTRATION
        // ==========================================

        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // ------------------------------------------
            // Check password match
            // ------------------------------------------

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.className = "error-message";

                return;
            }


            // ------------------------------------------
            // Disable button while registering
            // ------------------------------------------

            registerButton.disabled = true;

            registerButton.textContent =
                "Creating Account...";


            message.textContent =
                "Creating your farmer account...";

            message.className = "";


            // ------------------------------------------
            // Cognito user attributes
            // ------------------------------------------

            const attributes = [

                new AmazonCognitoIdentity.CognitoUserAttribute({
                    Name: "email",
                    Value: email
                }),

                new AmazonCognitoIdentity.CognitoUserAttribute({
                    Name: "name",
                    Value: fullName
                })

            ];


            // ------------------------------------------
            // Create Cognito account
            // ------------------------------------------

            userPool.signUp(
                email,
                password,
                attributes,
                null,
                function(error, result) {

                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Create Farmer Account";


                    if (error) {

                        console.error(
                            "Cognito registration error:",
                            error
                        );


                        message.textContent =
                            error.message ||
                            "Registration failed. Please try again.";

                        message.className =
                            "error-message";

                        return;
                    }


                    console.log(
                        "Cognito registration successful:",
                        result
                    );


                    // Store temporary farmer information.
                    // We will move application profile data
                    // into DynamoDB later.

                    sessionStorage.setItem(
                        "registrationEmail",
                        email
                    );

                    sessionStorage.setItem(
                        "registrationPhone",
                        phone
                    );

                    sessionStorage.setItem(
                        "registrationAddress",
                        address
                    );


                    message.textContent =
                        "Account created successfully! Please check your email for the verification code.";

                    message.className =
                        "success-message";


                    // ------------------------------------------
                    // Temporary next step
                    // ------------------------------------------

                    setTimeout(function() {

                        window.location.href =
                            "confirm.html";

                    }, 1500);

                }
            );

        });

    </script>

</body>
</html>
